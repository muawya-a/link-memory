name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend checks and dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Collect all tests
        run: python -m pytest --collect-only -q

      - name: Run backend tests
        run: python -m pytest tests/backend -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard-react/package-lock.json

      - name: Install locked dashboard dependencies
        run: npm ci --prefix dashboard-react

      - name: Build dashboard
        run: npm run build --prefix dashboard-react
